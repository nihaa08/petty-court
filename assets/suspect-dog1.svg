<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Mugshot background -->
  <rect width="240" height="240" fill="#18151D"/>
  <line x1="0" y1="40" x2="240" y2="40" stroke="#2F283B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="70" x2="240" y2="70" stroke="#2F283B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="100" x2="240" y2="100" stroke="#2F283B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="130" x2="240" y2="130" stroke="#2F283B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#2F283B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Dog Body -->
  <path d="M45 240 C45 160 80 145 120 145 C160 145 195 160 195 240 Z" fill="#E2A645"/>

  <!-- Floppy Ears -->
  <path d="M65 95 Q38 135 55 170 Q75 160 80 120 Z" fill="#BF7D20"/>
  <path d="M175 95 Q202 135 185 170 Q165 160 160 120 Z" fill="#BF7D20"/>

  <!-- Dog Head -->
  <ellipse cx="120" cy="115" rx="46" ry="42" fill="#EBB459"/>

  <!-- Snout -->
  <ellipse cx="120" cy="138" rx="26" ry="20" fill="#FCE1A9"/>
  <!-- Flour dusting on nose (Evidence Exhibit A!) -->
  <ellipse cx="120" cy="130" rx="18" ry="12" fill="#FFFFFF" opacity="0.85"/>
  <polygon points="120,132 108,122 132,122" fill="#24180A"/>
  <path d="M120 132 L120 142 Q112 148 106 144 M120 142 Q128 148 134 144" fill="none" stroke="#24180A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Big Puppy Eyes (Too cute to convict) -->
  <ellipse cx="98" cy="102" rx="9" ry="11" fill="#2E1C0C"/>
  <ellipse cx="142" cy="102" rx="9" ry="11" fill="#2E1C0C"/>
  <circle cx="95" cy="98" r="3.5" fill="#FFFFFF"/>
  <circle cx="101" cy="105" r="1.5" fill="#FFFFFF"/>
  <circle cx="139" cy="98" r="3.5" fill="#FFFFFF"/>
  <circle cx="145" cy="105" r="1.5" fill="#FFFFFF"/>

  <!-- Arrest Placard -->
  <rect x="35" y="195" width="170" height="40" rx="4" fill="#0E0D12" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="120" y="212" fill="#F8F6F0" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">PETTY PD #4412</text>
  <text x="120" y="226" fill="#D4AF37" font-size="9" font-family="sans-serif" text-anchor="middle">SIR WIGGLEBOTTOM</text>
</svg>

