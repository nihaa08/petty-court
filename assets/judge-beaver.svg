<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBeaver" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F362F" />
      <stop offset="100%" stop-color="#091410" />
    </radialGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6A15" />
    </linearGradient>
    <linearGradient id="furBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A5129" />
      <stop offset="100%" stop-color="#542B10" />
    </linearGradient>
  </defs>
  <!-- Background circle with gold rim -->
  <circle cx="120" cy="120" r="115" fill="url(#bgBeaver)" stroke="url(#goldB)" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#goldB)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Robe -->
  <path d="M40 220 Q120 185 200 220 L210 240 L30 240 Z" fill="#111714" stroke="#1D2A24" stroke-width="2"/>
  
  <!-- Famous Ruth Bader Ginsburg style dissent collar (elaborate lace!) -->
  <path d="M85 186 Q120 205 155 186 L150 196 Q120 216 90 196 Z" fill="#FFFFFF" stroke="url(#goldB)" stroke-width="1.2"/>
  <path d="M92 195 Q120 212 148 195 L144 204 Q120 220 96 204 Z" fill="#FFFFFF" stroke="url(#goldB)" stroke-width="1"/>

  <!-- Round Beaver Ears -->
  <circle cx="75" cy="95" r="15" fill="#542B10"/>
  <circle cx="75" cy="95" r="9" fill="#B37854"/>
  <circle cx="165" cy="95" r="15" fill="#542B10"/>
  <circle cx="165" cy="95" r="9" fill="#B37854"/>

  <!-- Beaver Head -->
  <ellipse cx="120" cy="135" rx="45" ry="42" fill="url(#furBrown)"/>
  
  <!-- Snout / Cheeks -->
  <ellipse cx="108" cy="154" rx="18" ry="14" fill="#B37854"/>
  <ellipse cx="132" cy="154" rx="18" ry="14" fill="#B37854"/>
  <!-- Beaver Nose -->
  <ellipse cx="120" cy="144" rx="12" ry="8" fill="#1F1510"/>

  <!-- Iconic Prominent Beaver Front Teeth (Meticulous Dam Engineer) -->
  <rect x="112" y="160" width="7" height="15" rx="1.5" fill="#FFFFFF" stroke="#8C6A15" stroke-width="1"/>
  <rect x="121" y="160" width="7" height="15" rx="1.5" fill="#FFFFFF" stroke="#8C6A15" stroke-width="1"/>

  <!-- Intellectual Thick Framed Glasses -->
  <rect x="90" y="118" width="25" height="20" rx="6" fill="rgba(255,255,255,0.15)" stroke="#111111" stroke-width="3"/>
  <rect x="125" y="118" width="25" height="20" rx="6" fill="rgba(255,255,255,0.15)" stroke="#111111" stroke-width="3"/>
  <line x1="115" y1="128" x2="125" y2="128" stroke="#111111" stroke-width="3"/>

  <!-- Stern piercing eyes behind glasses -->
  <circle cx="102" cy="128" r="4.5" fill="#1B1006"/>
  <circle cx="138" cy="128" r="4.5" fill="#1B1006"/>
  <circle cx="100.5" cy="126.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="136.5" cy="126.5" r="1.5" fill="#FFFFFF"/>

  <!-- Whiskers -->
  <line x1="90" y1="152" x2="60" y2="150" stroke="#111111" stroke-width="1.2"/>
  <line x1="90" y1="157" x2="62" y2="162" stroke="#111111" stroke-width="1.2"/>
  <line x1="150" y1="152" x2="180" y2="150" stroke="#111111" stroke-width="1.2"/>
  <line x1="150" y1="157" x2="178" y2="162" stroke="#111111" stroke-width="1.2"/>
</svg>

