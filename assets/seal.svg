<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8" />
      <stop offset="40%" stop-color="#E2B743" />
      <stop offset="75%" stop-color="#A57D18" />
      <stop offset="100%" stop-color="#F9E298" />
    </linearGradient>
    <radialGradient id="sealCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#070B12" />
    </radialGradient>
  </defs>
  <!-- Outer Rings -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="100" cy="100" r="90" fill="url(#sealCenter)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="83" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="1 1"/>

  <!-- Laurel Wreath -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M30 110 C 26 78, 42 46, 68 30 C 65 38, 51 56, 49 76 C 46 92, 53 103, 51 113 Z"/>
    <path d="M170 110 C 174 78, 158 46, 132 30 C 135 38, 149 56, 151 76 C 154 92, 147 103, 149 113 Z"/>
  </g>

  <!-- Crest Stars -->
  <polygon points="100,20 102,25 107,25 103,29 105,34 100,31 95,34 97,29 93,25 98,25" fill="url(#goldGrad)"/>
  <polygon points="64,30 65,34 69,34 66,37 67,41 64,38 61,41 62,37 59,34 63,34" fill="url(#goldGrad)"/>
  <polygon points="136,30 137,34 141,34 138,37 139,41 136,38 133,41 134,37 131,34 135,34" fill="url(#goldGrad)"/>

  <!-- Center Pillar -->
  <rect x="98" y="48" width="4" height="90" rx="2" fill="url(#goldGrad)"/>
  <circle cx="100" cy="48" r="6" fill="url(#goldGrad)"/>
  
  <!-- Scales crossbeam, tipped intentionally toward the cat paw (guilty!) -->
  <line x1="52" y1="58" x2="148" y2="72" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Left Pan (Paw - heavier!) -->
  <line x1="54" y1="58" x2="42" y2="95" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <line x1="54" y1="58" x2="66" y2="95" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M38 95 Q54 110 70 95 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <g transform="translate(48, 83) scale(0.65)" fill="url(#goldGrad)">
    <ellipse cx="10" cy="15" rx="5" ry="4"/>
    <circle cx="4" cy="8" r="2.2"/>
    <circle cx="8.5" cy="5" r="2.2"/>
    <circle cx="13.5" cy="5" r="2.2"/>
    <circle cx="17.5" cy="8" r="2.2"/>
  </g>

  <!-- Right Pan (Bone - lighter!) -->
  <line x1="146" y1="72" x2="134" y2="108" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <line x1="146" y1="72" x2="158" y2="108" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M130 108 Q146 123 162 108 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <path d="M141 102 C139 100 137 102 137 104 C137 106 139 107 141 106 L151 106 C153 107 155 106 155 104 C155 102 153 100 151 102 Z" fill="url(#goldGrad)"/>

  <!-- Pedestal -->
  <path d="M78 138 L122 138 L128 147 L72 147 Z" fill="url(#goldGrad)"/>
  <rect x="68" y="147" width="64" height="5" rx="2.5" fill="url(#goldGrad)"/>

  <!-- Curving text banner -->
  <text font-family="'Cinzel', Georgia, serif" font-weight="700" font-size="8" fill="url(#goldGrad)" letter-spacing="1.5" text-anchor="middle">
    <textPath href="#textPathArc" startOffset="50%">LEX ANIMALIS • JUSTITIA</textPath>
  </text>
  <defs>
    <path id="textPathArc" d="M 30,148 A 76,76 0 0,0 170,148" fill="none"/>
  </defs>
</svg>

