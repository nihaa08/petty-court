<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCat" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#223354" />
      <stop offset="100%" stop-color="#0E1626" />
    </radialGradient>
    <linearGradient id="goldJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6A15" />
    </linearGradient>
    <linearGradient id="furBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3139" />
      <stop offset="100%" stop-color="#15171C" />
    </linearGradient>
  </defs>
  <!-- Background circle with gold rim -->
  <circle cx="120" cy="120" r="115" fill="url(#bgCat)" stroke="url(#goldJ)" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#goldJ)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Robe -->
  <path d="M40 220 Q120 185 200 220 L210 240 L30 240 Z" fill="#111317" stroke="#1D2027" stroke-width="2"/>
  <!-- Judicial White Jabot / Lace Collar -->
  <path d="M102 182 L138 182 L132 215 L120 222 L108 215 Z" fill="#F8F6F0" stroke="#DDD6C6" stroke-width="1.5"/>
  <line x1="120" y1="185" x2="120" y2="218" stroke="#CBC4B3" stroke-width="1"/>

  <!-- Barrister Powdered Wig Behind Ears -->
  <ellipse cx="78" cy="125" rx="18" ry="32" fill="#EAECEF"/>
  <ellipse cx="162" cy="125" rx="18" ry="32" fill="#EAECEF"/>
  <ellipse cx="75" cy="155" rx="14" ry="24" fill="#DFE2E6"/>
  <ellipse cx="165" cy="155" rx="14" ry="24" fill="#DFE2E6"/>

  <!-- Cat Ears -->
  <polygon points="76,105 60,50 102,78" fill="url(#furBlack)"/>
  <polygon points="80,100 68,60 98,82" fill="#D48A96" opacity="0.65"/>
  <polygon points="164,105 180,50 138,78" fill="url(#furBlack)"/>
  <polygon points="160,100 172,60 142,82" fill="#D48A96" opacity="0.65"/>

  <!-- Wig Top curls -->
  <path d="M78 80 Q120 52 162 80 Q170 100 160 115 Q120 95 80 115 Q70 100 78 80 Z" fill="#F0F2F5"/>
  <circle cx="95" cy="74" r="12" fill="#E2E5E9"/>
  <circle cx="120" cy="70" r="13" fill="#EAECEF"/>
  <circle cx="145" cy="74" r="12" fill="#E2E5E9"/>

  <!-- Cat Head -->
  <ellipse cx="120" cy="138" rx="46" ry="40" fill="url(#furBlack)"/>
  <!-- White Tuxedo Chin Patch -->
  <path d="M104 150 Q120 162 136 150 Q142 178 120 184 Q98 178 104 150 Z" fill="#FFFFFF"/>

  <!-- Cat Eyes (Stern judicial look) -->
  <ellipse cx="102" cy="132" rx="11" ry="8" fill="#F4CA38" transform="rotate(-5 102 132)"/>
  <ellipse cx="138" cy="132" rx="11" ry="8" fill="#F4CA38" transform="rotate(5 138 132)"/>
  <!-- Pupils (Narrow, skeptical) -->
  <ellipse cx="102" cy="132" rx="3.5" ry="7.5" fill="#111111"/>
  <ellipse cx="138" cy="132" rx="3.5" ry="7.5" fill="#111111"/>
  <!-- Eye highlights -->
  <circle cx="100" cy="130" r="2" fill="#FFFFFF"/>
  <circle cx="136" cy="130" r="2" fill="#FFFFFF"/>

  <!-- Gold Monocle on Right Eye -->
  <circle cx="138" cy="132" r="14" fill="none" stroke="url(#goldJ)" stroke-width="2.5"/>
  <line x1="152" y1="134" x2="168" y2="185" stroke="url(#goldJ)" stroke-width="1.2" stroke-dasharray="2 1.5"/>

  <!-- Cat Nose & Mouth -->
  <polygon points="120,150 115,144 125,144" fill="#D48A96"/>
  <path d="M120 150 L120 156 Q114 162 108 158 M120 156 Q126 162 132 158" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Whiskers (Distinguished) -->
  <line x1="88" y1="148" x2="55" y2="142" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="86" y1="155" x2="52" y2="155" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="88" y1="162" x2="58" y2="168" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="152" y1="148" x2="185" y2="142" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="154" y1="155" x2="188" y2="155" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="152" y1="162" x2="182" y2="168" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
</svg>

