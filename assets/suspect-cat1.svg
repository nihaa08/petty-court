<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Mugshot background with height measurement lines -->
  <rect width="240" height="240" fill="#131B2A"/>
  <line x1="0" y1="40" x2="240" y2="40" stroke="#253550" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="70" x2="240" y2="70" stroke="#253550" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="100" x2="240" y2="100" stroke="#253550" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="130" x2="240" y2="130" stroke="#253550" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="160" x2="240" y2="160" stroke="#253550" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="0" y1="190" x2="240" y2="190" stroke="#253550" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="10" y="44" fill="#4B6080" font-size="10" font-family="monospace">18 IN</text>
  <text x="10" y="74" fill="#4B6080" font-size="10" font-family="monospace">15 IN</text>
  <text x="10" y="104" fill="#4B6080" font-size="10" font-family="monospace">12 IN</text>
  <text x="10" y="134" fill="#4B6080" font-size="10" font-family="monospace">09 IN</text>

  <!-- Body -->
  <path d="M50 240 C50 170 80 150 120 150 C160 150 190 170 190 240 Z" fill="#1C212B"/>
  <polygon points="120,150 100,200 140,200" fill="#E8EDF2"/>

  <!-- Ears -->
  <polygon points="75,100 55,42 98,70" fill="#1C212B"/>
  <polygon points="80,95 65,55 95,75" fill="#D67B8A" opacity="0.7"/>
  <polygon points="165,100 185,42 142,70" fill="#1C212B"/>
  <polygon points="160,95 175,55 145,75" fill="#D67B8A" opacity="0.7"/>

  <!-- Cat Head -->
  <circle cx="120" cy="115" r="44" fill="#242B38"/>
  <!-- White facial markings -->
  <polygon points="120,105 105,145 135,145" fill="#FFFFFF"/>
  <ellipse cx="120" cy="138" rx="20" ry="14" fill="#FFFFFF"/>

  <!-- Unrepentant Green Eyes -->
  <ellipse cx="102" cy="108" rx="10" ry="8" fill="#52B788"/>
  <ellipse cx="138" cy="108" rx="10" ry="8" fill="#52B788"/>
  <ellipse cx="102" cy="108" rx="3" ry="7" fill="#0D1F16"/>
  <ellipse cx="138" cy="108" rx="3" ry="7" fill="#0D1F16"/>
  <circle cx="100" cy="106" r="2" fill="#FFFFFF"/>
  <circle cx="136" cy="106" r="2" fill="#FFFFFF"/>

  <!-- Nose & Mouth -->
  <polygon points="120,125 116,120 124,120" fill="#E08B9B"/>
  <path d="M120 125 L120 130 Q114 135 110 132 M120 130 Q126 135 130 132" fill="none" stroke="#242B38" stroke-width="2"/>

  <!-- Whiskers -->
  <line x1="95" y1="126" x2="60" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="95" y1="131" x2="58" y2="132" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="145" y1="126" x2="180" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="145" y1="131" x2="182" y2="132" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>

  <!-- Arrest Placard -->
  <rect x="40" y="195" width="160" height="40" rx="4" fill="#0A0E17" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="120" y="212" fill="#F8F6F0" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="bold" text-anchor="middle">PETTY PD #9042</text>
  <text x="120" y="226" fill="#D4AF37" font-size="9" font-family="sans-serif" text-anchor="middle">BARNABY VON CLAWS</text>
</svg>

