<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bgOwl" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#261E38" />
      <stop offset="100%" stop-color="#0E0B17" />
    </radialGradient>
    <linearGradient id="goldO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6A15" />
    </linearGradient>
  </defs>
  <!-- Background circle with gold rim -->
  <circle cx="120" cy="120" r="115" fill="url(#bgOwl)" stroke="url(#goldO)" stroke-width="3"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="url(#goldO)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Robe -->
  <path d="M40 220 Q120 185 200 220 L210 240 L30 240 Z" fill="#15121F" stroke="#252033" stroke-width="2"/>
  <!-- Velvet Sash -->
  <path d="M105 185 L135 185 L128 220 L112 220 Z" fill="#6A1B9A" stroke="url(#goldO)" stroke-width="1"/>

  <!-- Feather Ear Tufts -->
  <polygon points="68,90 52,45 88,72" fill="#5D4037"/>
  <polygon points="172,90 188,45 152,72" fill="#5D4037"/>
  <polygon points="72,85 62,55 84,72" fill="#8D6E63"/>
  <polygon points="168,85 178,55 156,72" fill="#8D6E63"/>

  <!-- Owl Head -->
  <ellipse cx="120" cy="125" rx="52" ry="46" fill="#6D4C41"/>
  <ellipse cx="120" cy="130" rx="42" ry="36" fill="#8D6E63"/>

  <!-- Huge Disc Eyes (Night Court Magistrate who sees everything) -->
  <circle cx="95" cy="122" r="24" fill="#3E2723"/>
  <circle cx="145" cy="122" r="24" fill="#3E2723"/>
  <circle cx="95" cy="122" r="20" fill="#FFB300"/>
  <circle cx="145" cy="122" r="20" fill="#FFB300"/>
  <circle cx="95" cy="122" r="11" fill="#111111"/>
  <circle cx="145" cy="122" r="11" fill="#111111"/>
  <!-- Eye highlights -->
  <circle cx="92" cy="118" r="3.5" fill="#FFFFFF"/>
  <circle cx="142" cy="118" r="3.5" fill="#FFFFFF"/>

  <!-- Golden Spectacles -->
  <circle cx="95" cy="122" r="23" fill="none" stroke="url(#goldO)" stroke-width="2"/>
  <circle cx="145" cy="122" r="23" fill="none" stroke="url(#goldO)" stroke-width="2"/>
  <path d="M118 122 Q120 118 122 122" stroke="url(#goldO)" stroke-width="2" fill="none"/>

  <!-- Sharp Curved Beak -->
  <polygon points="113,136 127,136 120,154" fill="#FFA000" stroke="#E65100" stroke-width="1"/>
</svg>

